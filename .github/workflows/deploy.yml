name: Deploy to PythonAnywhere

on:
  push:
    branches-ignore:
      - master

jobs:
  deploy-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to PythonAnywhere
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          APP_ROOT="/home/IanFogelman/family_fun_app"
          API_BASE="https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}"

          upload_file() {
            local local_path="$1"
            local remote_path="$2"
            echo "Uploading ${local_path} -> ${remote_path}"
            curl -s -X POST \
              -H "Authorization: Token ${PA_API_TOKEN}" \
              -F "content=@${local_path}" \
              "${API_BASE}/files/path${remote_path}/"
          }

          # HTML goes into Flask's templates folder
          upload_file "pokemon_quest.html" "${APP_ROOT}/templates/pokemon_quest.html"
          # DB goes into the app root (where app.py expects it)
          upload_file "pokemon_quest.duckdb" "${APP_ROOT}/pokemon_quest.duckdb"

      - name: Reload PythonAnywhere web app
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          DOMAIN="${PA_USERNAME}.pythonanywhere.com"
          echo "Reloading web app at ${DOMAIN}"
          curl -s -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${DOMAIN}/reload/"

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if PR already exists for this branch
          EXISTING=$(gh pr list --repo ${{ github.repository }} --head ${{ github.ref_name }} --base master --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for this branch, skipping."
            exit 0
          fi

          gh pr create \
            --repo ${{ github.repository }} \
            --base master \
            --head ${{ github.ref_name }} \
            --title "Deploy: ${{ github.ref_name }} → master" \
            --body "## Deployment Summary

          Branch \`${{ github.ref_name }}\` has been deployed to PythonAnywhere for review.

          **Live preview:** https://${{ secrets.PA_USERNAME }}.pythonanywhere.com/pokemon-quest

          ### Changed files
          - \`pokemon_quest.html\`
          - \`pokemon_quest.duckdb\`

          ### Checklist
          - [ ] Tested on PythonAnywhere preview
          - [ ] No regressions"
